connect:
  google_compute_external_vpn_gateway.datacenter:
  - google_compute_ha_vpn_gateway.migration: HA VPN
  google_compute_ha_vpn_gateway.migration:
  - google_compute_machine_image.migrated: Disk replication
  - google_database_migration_service_migration_job.mysql: Binlog replication
flows:
  Migrate:
    description: The application moves from the data centre
    color: '#D93025'
    steps:
    - resource: tv_gcp_server.web_vms -> google_compute_external_vpn_gateway.datacenter
      xlabel: Replicate
      detail: Migrate to Virtual Machines replicates the web and app VMs' disks over HA VPN
    - resource: google_compute_ha_vpn_gateway.migration -> google_compute_machine_image.migrated
      xlabel: Image
      detail: and turns each tested replica into an image
    - resource: google_compute_machine_image.migrated -> google_compute_instance_template.web
      xlabel: Template
      detail: which the web and app instance templates boot from
    - resource: tv_gcp_database.mysql -> google_compute_external_vpn_gateway.datacenter
      xlabel: Sync
      detail: Database Migration Service copies MySQL across the VPN
    - resource: google_database_migration_service_migration_job.mysql -> google_sql_database_instance.shop
      xlabel: Load
      detail: and keeps Cloud SQL in sync from the binlog until cutover
  Serve:
    description: Customers use the migrated shop
    color: '#188038'
    steps:
    - resource: tv_gcp_users_icon.customers -> google_compute_global_forwarding_rule.https
      xlabel: HTTPS
      detail: At cutover DNS points the shop at the global external load balancer
    - resource: google_compute_backend_service.web -> google_compute_instance.web~1
      xlabel: Web
      detail: which sends requests through Cloud Armor to the web tier's managed instance group in two zones
    - resource: google_compute_instance.web~1 -> google_filestore_instance.shared_content
      xlabel: Content
      detail: The web VMs share uploaded content on Filestore
    - resource: google_compute_instance.web~1 -> google_compute_forwarding_rule.app_internal_lb
      xlabel: App
      detail: and call the app tier through an internal load balancer
    - resource: google_compute_instance.app~1 -> google_sql_database_instance.shop
      xlabel: Query
      detail: The app VMs query the regional HA Cloud SQL instance
    - resource: google_compute_router_nat.egress -> tv_gcp_server.payment_gateway
      xlabel: Pay
      detail: and reach the payment provider through Cloud NAT
