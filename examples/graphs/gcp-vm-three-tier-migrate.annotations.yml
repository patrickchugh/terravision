#   terravision draw --source gcp-vm-three-tier-migrate.tvg.json --annotate gcp-vm-three-tier-migrate.annotations.yml
format: '0.3'
title: Google Cloud three-tier VM application migrated from on-premises with Migrate to VMs and DMS
