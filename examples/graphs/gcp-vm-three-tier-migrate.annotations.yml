    ip_cidr_range: 10.140.0.0/24
  google_compute_subnetwork.app:
    ip_cidr_range: 10.140.1.0/24
  tv_gcp_onprem.datacenter:
    label: Corporate Datacenter
  tv_gcp_zone.europe_west2_a_app:
    label: Europe West2 A
  tv_gcp_zone.europe_west2_b_app:
    label: Europe West2 B
  google_sql_database_instance.shop:
    label: Cloud SQL MySQL (HA)
  tv_gcp_logical_group.migration:
    label: Migration
  google_compute_machine_image.migrated:
    label: Migrate to VMs Migrated
  google_compute_external_vpn_gateway.datacenter:
    label: Peer VPN Gateway Datacenter
  google_compute_backend_service.web:
    label: Backend Service Web
  google_compute_forwarding_rule.app_internal_lb:
    label: Forwarding Rule App Internal Lb
  google_compute_global_forwarding_rule.https:
    label: Forwarding Rule Https
  google_compute_ha_vpn_gateway.migration:
    label: HA VPN Migration
  google_compute_instance_template.app:
    label: Instance Template App
  google_compute_instance_template.web:
    label: Instance Template Web
  google_compute_region_backend_service.app:
    label: Backend Service App
  google_compute_region_instance_group_manager.app:
    label: Managed Instance Group App
  google_compute_region_instance_group_manager.web:
    label: Managed Instance Group Web
  google_compute_router.egress:
    label: Cloud Router Egress
  google_compute_router.migration:
    label: Cloud Router Migration
  google_compute_router_nat.egress:
    label: Cloud NAT Egress
  google_compute_security_policy.edge:
    label: Cloud Armor Edge
  google_compute_url_map.shop:
    label: URL Map Shop
  google_database_migration_service_connection_profile.source:
    label: DMS Connection Profile Source
  google_database_migration_service_migration_job.mysql:
    label: DMS Migration Job Mysql
  google_filestore_instance.shared_content:
    label: Filestore Shared Content
  google_kms_key_ring.shop:
