  aws_subnet.public~2:
    cidr_block: 10.20.1.0/24
  aws_subnet.functions~1:
    cidr_block: 10.20.16.0/20
  aws_subnet.functions~2:
    cidr_block: 10.20.32.0/20
  aws_subnet.endpoints~1:
    cidr_block: 10.20.240.0/24
  aws_subnet.endpoints~2:
    cidr_block: 10.20.241.0/24
