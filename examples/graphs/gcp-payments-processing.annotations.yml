connect:
  google_apigee_instance.payments:
  - google_compute_forwarding_rule.psc_payments_api: PSC southbound
  google_compute_router_nat.egress:
  - tv_gcp_server.card_networks: mTLS 443
flows:
  Authorise:
    description: A card payment is authorised
    color: '#D93025'
    steps:
    - resource: tv_gcp_users_icon.merchants -> google_compute_global_forwarding_rule.https
      xlabel: Pay
      detail: A merchant's checkout posts a payment to the global external load balancer
    - resource: google_compute_backend_service.apigee -> google_apigee_instance.payments
      xlabel: API
      detail: Cloud Armor filters it and Apigee checks the merchant's key, quota and schema
    - resource: google_apigee_instance.payments -> google_compute_forwarding_rule.psc_payments_api
      xlabel: Forward
      detail: Apigee reaches the cardholder data environment through Private Service Connect
    - resource: google_compute_region_backend_service.payments_api -> google_compute_instance.payments_node~1
      xlabel: Process
      detail: An internal load balancer sends it to the payment pods on a private GKE cluster
    - resource: google_compute_instance.payments_node~1 -> google_sql_database_instance.token_vault
      xlabel: Tokenise
      detail: The pods swap the card number for a token, encrypting it in the vault with a Cloud HSM key
    - resource: google_compute_instance.payments_node~1 -> google_compute_router_nat.egress
      xlabel: Authorise
      detail: and send the authorisation to the card networks through Cloud NAT
    - resource: google_compute_instance.payments_node~1 -> google_compute_global_forwarding_rule.psc_google_apis
      xlabel: Record
      detail: They record the transaction in Spanner and publish the capture to Pub/Sub
  Settle:
    description: The day's captures are settled
    color: '#188038'
    steps:
    - resource: google_cloud_run_v2_job.settlement -> google_compute_global_forwarding_rule.psc_google_apis
      xlabel: Batch
      detail: At cut-off a Cloud Run job reads the day's captures and writes the settlement file to a locked audit bucket
    - resource: google_cloud_run_v2_job.settlement -> google_compute_router_nat.egress
      xlabel: Send
      detail: and sends it to the acquirer through Cloud NAT
