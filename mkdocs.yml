site_name: TerraVision
site_description: Free, open-source cloud architecture diagrams in both directions. Describe a design to your AI assistant and get an AWS, Azure or GCP diagram and its Terraform, or draw what your Terraform deploys.
site_url: https://patrickchugh.github.io/terravision/
repo_url: https://github.com/patrickchugh/terravision
repo_name: patrickchugh/terravision
edit_uri: edit/main/docs/
copyright: Copyright &copy; Patrick Chugh

docs_dir: docs

theme:
  name: material
  logo: assets/logo/terravision-icon.svg
  favicon: assets/logo/favicon.ico
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox
      auto_caption: false
      caption_position: bottom

nav:
  - Home: index.md
  - Gallery: gallery.md
  - Use with AI assistants: ai-assistants.md
  - Graph Format (JSON input): graph-format.md
  - Node types: node-types.md
  - Getting Started:
      - Installation: installation.md
      - Usage Guide: usage-guide.md
  - Features:
      - Annotations: annotations.md
      - CI/CD Integration: cicd-integration.md
      - MCP Server: mcp-server.md
      - llms.txt for AI agents: https://patrickchugh.github.io/terravision/llms.txt
  - Diagram generators:
      - Cloud architecture diagram generator: cloud-architecture-diagram-generator.md
      - AI diagram generator (description to diagram): ai-cloud-architecture-diagram-generator.md
      - Diagram to Terraform: diagram-to-terraform.md
      - AWS diagram generator: aws-architecture-diagram-generator.md
      - Azure diagram generator: azure-architecture-diagram-generator.md
      - Google Cloud diagram generator: gcp-architecture-diagram-generator.md
      - Terraform diagram generator: terraform-diagram-generator.md
      - Compared with other tools: alternatives.md
  - Help:
      - FAQ: faq.md
      - Troubleshooting: troubleshooting.md
  - Contributing:
      - Contributing Guide: CONTRIBUTING.md
      - Developer Guide: developer-guide.md
      - Resource Handler Guide: resource-handler-guide.md
      - Project Constitution: constitution.md
  - Live Demos:
      - AWS Demo: demo-aws.html
      - Azure Demo: demo-azure.html
      - GCP Demo: demo-gcp.html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/patrickchugh/terravision
    - icon: fontawesome/brands/youtube
      link: https://youtu.be/BbXWR-v_Dl0
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/terravision/

exclude_docs: |
  CLAUDE.md
  LEARNINGS_*.md
  metadata-refactor-plan.md
  README.md
