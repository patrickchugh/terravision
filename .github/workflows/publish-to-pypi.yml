# yamllint disable rule:line-length
---
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v0.9.7, v1.0.0, etc.

permissions:
  contents: read
  id-token: write  # Required for PyPI trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      #----------------------------------------------
      #       load cached venv if cache exists
      #----------------------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      #----------------------------------------------
      # install dependencies
      #----------------------------------------------
      - name: Install Graphviz and development headers
        run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev
      - name: Install python dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      #----------------------------------------------
      # build and publish to PyPI
      #----------------------------------------------
      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  publish-mcp-registry:
    # The registry validates the referenced PyPI version exists (and that its
    # README carries the mcp-name token), so this must run after the PyPI
    # publish. id-token: write grants the GitHub OIDC credential that
    # authenticates the io.github.patrickchugh/* namespace - no stored secret.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        # Version pinned: this job holds a publishing credential, so do not
        # execute whatever binary "latest" resolves to on a given day.
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Set version in server.json from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Wait for PyPI to serve the new version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/terravision/${VERSION}/json" > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "PyPI never served terravision ${VERSION}" >&2
          exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
