# yamllint disable rule:line-length
---
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v0.9.7, v1.0.0, etc.
  # Manual re-run of the MCP Registry step only, for a version already on
  # PyPI (e.g. after a registry-side validation failure). Uses server.json
  # from the branch it is run on; the PyPI job is skipped.
  workflow_dispatch:
    inputs:
      version:
        description: "Version already on PyPI to publish to the MCP Registry (e.g. 0.48.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for PyPI trusted publishing (OIDC)
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.3.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      #----------------------------------------------
      #       load cached venv if cache exists
      #----------------------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      #----------------------------------------------
      # install dependencies
      #----------------------------------------------
      - name: Install Graphviz and development headers
        run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev
      - name: Install python dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      #----------------------------------------------
      # build and publish to PyPI
      #----------------------------------------------
      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true

  publish-mcp-registry:
    # The registry validates the referenced PyPI version exists (and that its
    # README carries the mcp-name token), so this must run after the PyPI
    # publish. id-token: write grants the GitHub OIDC credential that
    # authenticates the io.github.patrickchugh/* namespace - no stored secret.
    needs: publish
    # A manual run skips the PyPI job, so run whenever it did not fail.
    if: >-
      always() && (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Passed through env rather than interpolated into scripts, and
      # checked below, because workflow_dispatch input is user-supplied.
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mcp-publisher
        # Version pinned: this job holds a publishing credential, so do not
        # execute whatever binary "latest" resolves to on a given day.
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set version in server.json
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Wait for PyPI to serve the new version
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/terravision/${VERSION}/json" > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "PyPI never served terravision ${VERSION}" >&2
          exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  publish-desktop-extension:
    # Builds the Claude Desktop extension (.mcpb) and the skill .zip and
    # attaches them to this tag's GitHub release, creating a draft release
    # when there is none yet (it stays private until published by hand). The
    # extension installs this exact version from PyPI, so it runs after the
    # PyPI publish.
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up node
        # Runs the official @anthropic-ai/mcpb CLI that validates and packs
        # the bundle.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Build the extension and the skill zip
        run: python scripts/build_mcpb.py

      - name: Attach them to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --notes "Release notes to follow."
          gh release upload "$TAG" dist/*.mcpb dist/*-skill-*.zip --clobber
