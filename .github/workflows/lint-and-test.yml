# yamllint disable rule:line-length
---
name: lint-and-test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # This is required for actions/checkout
      id-token: write     # This is required for OIDC authentication with AWS
    env:
      # GitHub gives a pull request from a fork no OIDC token, so it cannot
      # assume the AWS role. Such runs skip the AWS step and the slow tests
      # (terraform plan against AWS); those run on main after the merge.
      # pull_request_target would hand the role to untrusted code instead.
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      # Whether the SonarQube token is available; the token itself stays in
      # the scan step. Fork and Dependabot pull requests get no secrets.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # SonarQube uses the full history to tell new code from old
          fetch-depth: 0
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.3.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      #----------------------------------------------
      #       load cached venv if cache exists
      #----------------------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      #----------------------------------------------
      #       Retrieve temporary AWS credentials
      #----------------------------------------------
      - name: Configure AWS credentials
        if: env.FORK_PR != 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        timeout-minutes: 2
        with:
          role-to-assume: arn:aws:iam::166659698090:role/githubactions
          role-session-name: ghasession
          aws-region: us-east-1

      #----------------------------------------------
      # install dependencies
      #----------------------------------------------
      - name: Install Graphviz and development headers
        run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev
      - name: Install python dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --with test
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: Install Terragrunt
        uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e # v3.0.2
        with:
          terragrunt-version: latest
          # Looks up "latest" through the GitHub API; unauthenticated, that
          # shares the runner's rate limit and can fail the job.
          token: ${{ github.token }}
      - name: Mock ssh file
        # The bastion test's Terraform reads id_rsa.pub; an empty file will do.
        run: touch id_rsa.pub

      #----------------------------------------------
      # Run static linters
      #----------------------------------------------
      - name: Check black formatting
        run: |
          poetry run  black --check -v modules
          
      #----------------------------------------------
      # add terravision to PATH
      #----------------------------------------------
      - name: Run tests after adding terravision to path
        run: |
          export PATH=$PATH:$(pwd)
          rm -rf ~/.terravision
          poetry run terravision --version
          COVERAGE="--cov=terravision --cov=modules --cov=resource_classes --cov-report=xml"
          if [ "$FORK_PR" = "true" ]; then
            echo "::notice::Pull request from a fork: slow tests need AWS credentials and run on main after the merge."
            poetry run pytest tests -v -m "not slow" $COVERAGE
          else
            poetry run pytest tests -v $COVERAGE
          fi

      #----------------------------------------------
      # SonarQube Cloud: settings in sonar-project.properties. Pull
      # requests without the token (forks, Dependabot) are analysed on main
      # after the merge.
      #----------------------------------------------
      # New code is "since the previous version", so each release resets it
      - name: Read the project version
        if: env.HAS_SONAR_TOKEN == 'true'
        id: version
        run: echo "version=$(poetry version --short)" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
