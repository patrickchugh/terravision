# SonarQube Cloud analysis, run by the lint-and-test workflow after the tests.
# Results: https://sonarcloud.io/project/overview?id=patrickchugh_terravision
sonar.organization=patrickchugh
sonar.projectKey=patrickchugh_terravision
sonar.projectName=TerraVision

# The shipped code. Diagram icons, examples, docs and build output are not code.
sonar.sources=terravision,modules,resource_classes
sonar.tests=tests
# Vendored, minified d3: third-party code, kept unmodified.
sonar.exclusions=modules/vendor/**
sonar.sourceEncoding=UTF-8

sonar.python.version=3.11,3.12,3.13,3.14
# Written by pytest --cov in the same job.
sonar.python.coverage.reportPaths=coverage.xml
