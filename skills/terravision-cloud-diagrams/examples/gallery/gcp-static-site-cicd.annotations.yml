# Title, CIDR ranges, arrow labels and flow steps for the gallery diagram. Use with:
#   terravision draw --source gcp-static-site-cicd.tvg.json --annotate gcp-static-site-cicd.annotations.yml
format: '0.3'
title: Google Cloud static website with Cloud CDN, a Cloud Run API and Cloud Build from GitHub
update:
  tv_gcp_external_saas.github:
    label: GitHub
  tv_gcp_external_saas.email:
    label: Email Provider
  google_compute_target_https_proxy.site:
    label: HTTPS Proxy Site
  google_artifact_registry_repository.api_images:
    label: Artifact Registry Api Images
  google_certificate_manager_certificate.site:
    label: Certificate Manager Site
  google_cloud_run_v2_service.api:
    label: Cloud Run Api
  google_cloudbuild_trigger.main:
    label: Cloud Build Main
  google_cloudbuild_trigger.pull_request:
    label: Cloud Build Pull Request
  google_cloudbuildv2_repository.site:
    label: Repository Site
  google_cloudfunctions2_function.contact:
    label: Cloud Functions Contact
  google_compute_backend_bucket.static:
    label: Backend Bucket Static
  google_compute_backend_service.api:
    label: Backend Service Api
  google_compute_global_forwarding_rule.https:
    label: Forwarding Rule Https
  google_compute_security_policy.edge:
    label: Cloud Armor Edge
  google_compute_url_map.site:
    label: URL Map Site
  google_dns_managed_zone.site:
    label: Cloud DNS Site
  google_firestore_database.content:
    label: Firestore Content
  google_identity_platform_config.members:
    label: Identity Platform Members
  google_kms_key_ring.site:
    label: Cloud KMS Site
  google_logging_project_sink.site:
    label: Log Sink Site
  google_pubsub_topic.contact_form:
    label: Pub/Sub Contact Form
  google_secret_manager_secret.sendgrid_key:
    label: Secret Manager Sendgrid Key
  google_storage_bucket.previews:
    label: Cloud Storage Previews
  google_storage_bucket.site:
    label: Cloud Storage Site
connect:
  google_compute_backend_bucket.static:
  - google_storage_bucket.site: Cloud CDN
  google_compute_url_map.site:
  - google_compute_backend_service.api: /api/*
  google_cloudbuild_trigger.main:
  - google_compute_url_map.site: Invalidate cache
flows:
  Visit:
    description: A visitor loads the site
    color: '#D93025'
    steps:
    - resource: tv_gcp_users_icon.visitors -> google_dns_managed_zone.site
      xlabel: Resolve
      detail: The site's name resolves in Cloud DNS to the load balancer's anycast IP
    - resource: google_certificate_manager_certificate.site -> google_compute_target_https_proxy.site
      xlabel: TLS
      detail: The HTTPS proxy ends TLS with a Certificate Manager certificate
    - resource: google_compute_backend_bucket.static -> google_storage_bucket.site
      xlabel: Pages
      detail: The URL map serves pages and assets from the site bucket through Cloud CDN
    - resource: tv_gcp_users_icon.visitors -> google_identity_platform_config.members
      xlabel: Sign in
      detail: Members sign in with Identity Platform
    - resource: google_compute_backend_service.api -> google_cloud_run_v2_service.api
      xlabel: API
      detail: Calls to /api go through Cloud Armor to the API on Cloud Run
    - resource: google_cloud_run_v2_service.api -> google_firestore_database.content
      xlabel: Content
      detail: which reads member content from Firestore
    - resource: google_cloudfunctions2_function.contact -> tv_gcp_server.sendgrid
      xlabel: Email
      detail: Contact form messages go through Pub/Sub to a function that emails the team
  Release:
    description: A merged change goes live
    color: '#188038'
    steps:
    - resource: tv_gcp_server.github -> google_cloudbuildv2_repository.site
      xlabel: Push
      detail: A pull request or merge in GitHub notifies Cloud Build
    - resource: google_cloudbuild_trigger.pull_request -> google_storage_bucket.previews
      xlabel: Preview
      detail: Each pull request builds a preview copy of the site
    - resource: google_cloudbuild_trigger.main -> google_storage_bucket.site
      xlabel: Publish
      detail: A merge to main builds the site and syncs it to the site bucket
    - resource: google_cloudbuild_trigger.main -> google_compute_url_map.site
      xlabel: Invalidate
      detail: invalidates the CDN cache
    - resource: google_artifact_registry_repository.api_images -> google_cloud_run_v2_service.api
      xlabel: Deploy
      detail: and deploys the new API image to Cloud Run
